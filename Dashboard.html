<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pet Adoption - Dashboard</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <h1>Pet Adoption Platform</h1>
    <h2>Dashboard</h2>

    <div class="dashboard-container">

        <div class="dashboard-card">
            <h3>Available Pets</h3>
            <p id="petCount">...</p>
        </div>

        <div class="dashboard-card">
            <h3>Adoption Applications</h3>
            <p id="applicationCount">...</p>
        </div>

        <div class="dashboard-card">
            <h3>Approved Applications</h3>
            <p id="approvedCount">...</p>
        </div>

    </div>

    <h2>Quick Actions</h2>

    <div class="dashboard-actions">
        <a href="index.html">View Available Pets</a>
        <a href="login.html">Login</a>
        <a href="register.html">Register</a>
    </div>

    <script>
        async function loadDashboard() {
            try {
                const [petsResponse, adoptionsResponse] = await Promise.all([
                    fetch("/api/pets"),
                    fetch("/api/adoptions")
                ]);

                const pets = await petsResponse.json();
                const adoptions = await adoptionsResponse.json();

                if (!Array.isArray(pets) || !Array.isArray(adoptions)) {
                    throw new Error("Unexpected data from the server");
                }

                const approved = adoptions.filter(function (a) {
                    return String(a.status || "").toLowerCase() === "approved";
                });

                document.getElementById("petCount").textContent = pets.length;
                document.getElementById("applicationCount").textContent = adoptions.length;
                document.getElementById("approvedCount").textContent = approved.length;

            } catch (error) {
                console.error(error);
                document.getElementById("petCount").textContent = "-";
                document.getElementById("applicationCount").textContent = "-";
                document.getElementById("approvedCount").textContent = "-";
            }
        }

        loadDashboard();
    </script>

</body>
</html>
